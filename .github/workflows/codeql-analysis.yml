name: "SecretSharingDotNet - CodeQL"

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  schedule:
    - cron: '18 17 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'actions' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The .NET build steps apply only to the C# analysis; 'actions' is a no-build
    # CodeQL language, so its matrix leg skips setup / restore / build.
    - name: Setup .NET SDKs
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.423
          9.0.316
          10.0.302

    - name: Initialize CodeQL
      uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      with:
        languages: ${{ matrix.language }}

    - name: Restore
      if: matrix.language == 'csharp'
      run: dotnet restore --locked-mode SecretSharingDotNet.slnx

    - name: Build
      if: matrix.language == 'csharp'
      run: dotnet build --configuration Release --no-restore SecretSharingDotNet.slnx

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
