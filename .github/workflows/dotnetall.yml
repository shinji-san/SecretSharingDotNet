name: SecretSharingDotNet - Build and Test All .NET Versions

on:
  push:
    branches:
    - '**'
    tags-ignore:
    - '**'
    # `paths` with negations instead of `paths-ignore`, because only `paths`
    # can re-include README.md: it is pack input (PackageReadmeFile), so a
    # README-only push still has to reach the pack step below. Other Markdown
    # and .gitignore cannot affect build, test, or pack; .gitattributes can
    # (checkout applies its eol / working-tree-encoding / filter rules while
    # materializing the sources), so it stays a trigger. Issue forms are YAML,
    # so the `**.md` negation no longer covers them and they need one of their
    # own. Last match wins.
    paths:
    - '**'
    - '!**.md'
    - 'README.md'
    - '!.gitignore'
    - '!.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
    - develop
    - main
    # Deliberately without the ISSUE_TEMPLATE negation that the push filter
    # carries: a pull request touching only the forms should still report a
    # status, so this check cannot become unsatisfiable if the target branch
    # is protected later.
    paths:
    - '**'
    - '!**.md'
    - 'README.md'
    - '!.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
    # No later step needs the git token: restore talks to nuget.org and
    # nothing pushes.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          8.0.423
          9.0.316
          10.0.302

    - name: Restore
      run: dotnet restore --locked-mode SecretSharingDotNet.slnx

    - name: Build
      run: dotnet build --configuration Release --no-restore SecretSharingDotNet.slnx

    # The ubuntu-24.04 image ships without Mono, so the .NET Framework suites
    # cannot run here; the build-windows job covers them on the real .NET
    # Framework instead. Each modern TFM is invoked with an explicit
    # --framework against the test project so the runner never tries to
    # launch a net4x executable.
    - name: Test (net8.0)
      run: dotnet test --no-restore --no-build --configuration Release --framework net8.0 tests/SecretSharingDotNetTest.csproj

    - name: Test (net9.0)
      run: dotnet test --no-restore --no-build --configuration Release --framework net9.0 tests/SecretSharingDotNetTest.csproj

    - name: Test (net10.0)
      run: dotnet test --no-restore --no-build --configuration Release --framework net10.0 tests/SecretSharingDotNetTest.csproj

    - name: Create Package
      run: dotnet pack --no-restore --no-build --configuration Release SecretSharingDotNet.slnx

  build-windows:

    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
    # No later step needs the git token: restore talks to nuget.org and
    # nothing pushes.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          8.0.423
          9.0.316
          10.0.302

    - name: Restore
      run: dotnet restore --locked-mode SecretSharingDotNet.slnx

    - name: Build
      run: dotnet build --configuration Release --no-restore SecretSharingDotNet.slnx

    # The net472/net48/net481 suites run here on the real .NET Framework the
    # assemblies target; the ubuntu-24.04 image of the build job has no Mono.
    - name: Test (net472)
      run: dotnet test --no-restore --no-build --configuration Release --framework net472 tests/SecretSharingDotNetTest.csproj

    - name: Test (net48)
      run: dotnet test --no-restore --no-build --configuration Release --framework net48 tests/SecretSharingDotNetTest.csproj

    - name: Test (net481)
      run: dotnet test --no-restore --no-build --configuration Release --framework net481 tests/SecretSharingDotNetTest.csproj
