name: SecretSharingDotNet - NuGet Publishing

on:
  push:
    tags:
    - 'v*'

# Serialize releases across all tags, and never cancel one: a publish interrupted
# between pack and push leaves the release half-done. This deliberately differs from
# the CI workflows, which group per ref and do cancel in progress.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC token for NuGet Trusted Publishing

jobs:
  build:

    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.416
          9.0.307
          10.0.100

    # Guard against a tag that does not match the version being packed. Without it a
    # tag pushed without bumping the version builds the previous release, and the push
    # below hits --skip-duplicate, which reports success without publishing anything.
    # Runs before the signing key is decrypted, so a mismatched tag never touches it.
    - name: Verify tag matches package version
      run: |
        set -euo pipefail
        tag_version="${GITHUB_REF_NAME#v}"
        csproj_version="$(dotnet msbuild src/SecretSharingDotNet.csproj -getProperty:Version)"
        release_notes="$(dotnet msbuild src/SecretSharingDotNet.csproj -getProperty:PackageReleaseNotes)"
        informational_version="$(sed -n 's/.*AssemblyInformationalVersion("\([^"]*\)").*/\1/p' src/Properties/AssemblyInfo.cs)"

        mismatch=0
        if [ "$csproj_version" != "$tag_version" ]; then
          echo "::error file=src/SecretSharingDotNet.csproj::<Version> is '$csproj_version', but tag ${GITHUB_REF_NAME} implies '$tag_version'"
          mismatch=1
        fi
        if [ "$informational_version" != "$tag_version" ]; then
          echo "::error file=src/Properties/AssemblyInfo.cs::AssemblyInformationalVersion is '$informational_version', but tag ${GITHUB_REF_NAME} implies '$tag_version'"
          mismatch=1
        fi
        case "$release_notes" in
          *"/blob/${GITHUB_REF_NAME}/"*) ;;
          *)
            echo "::error file=src/SecretSharingDotNet.csproj::PackageReleaseNotes does not link to tag ${GITHUB_REF_NAME}: ${release_notes}"
            mismatch=1
            ;;
        esac

        if [ "$mismatch" -ne 0 ]; then
          echo "Refusing to publish: the release version is not in lockstep with the tag ${GITHUB_REF_NAME}."
          echo "Publishing anyway would push an already-released version, which --skip-duplicate reports as success without publishing anything."
          exit 1
        fi
        echo "Tag ${GITHUB_REF_NAME} matches version ${csproj_version}."

    - name: Decrypt large secret
      run: ./.github/secrets/decrypt_publisher_snk.sh
      env:
        PUBLISHER_SNK: ${{ secrets.PUBLISHER_SNK }}
        PUBLISHER_PUB_KEY: ${{ secrets.PUBLISHER_PUB_KEY }}

    - name: Restore
      run: dotnet restore --locked-mode SecretSharingDotNet.slnx

    - name: Build
      run: dotnet build --configuration Release --no-restore SecretSharingDotNet.slnx

    - name: Test
      run: dotnet test --no-restore --no-build --configuration Release SecretSharingDotNet.slnx -- RunConfiguration.TargetPlatform=x64 RunConfiguration.MaxCpuCount=1  xUnit.AppDomain=denied xUnit.ParallelizeAssembly=false xUnit.ParallelizeTestCollections=false

    - name: Remove obsolete NuGet packages
      run: rm -f src/bin/Release/SecretSharingDotNet*.nupkg

    # The extraction below is driven entirely by these two headings. If one stops
    # matching, the pipeline yields an empty README and pack fails with a NU5040 that
    # names the empty file rather than the renamed heading; if one matches twice, the
    # extraction duplicates content and ships a wrong README without any error at all.
    # Check both up front so the real cause is named. The install heading is matched
    # without its trailing emoji, so it stays in step with dotnetall.yml.
    - name: Prepare README.md for NuGet package
      run: |
           set -euo pipefail
           for heading in "## Install SecretSharingDotNet package" "# CLI building instructions"; do
             matches="$(grep -cF "$heading" README.md || true)"
             if [ "$matches" -ne 1 ]; then
               echo "::error file=README.md::Expected exactly one line containing '$heading', found ${matches}. The packaged README is built by extracting between these headings."
               exit 1
             fi
           done
           grep -n "## Install SecretSharingDotNet package" README.md | cut -d: -f 1| xargs -i tail -n +{} README.md > TMP.md && sed -i '1s/^/# Setup\r\n/' TMP.md && mv -f TMP.md README.md
           grep -n "# CLI building instructions" README.md | cut -d: -f 1| xargs -i head -n {} README.md | head -n -1 > TMP.md && mv -f TMP.md README.md

    - name: Create package
      run: dotnet pack --no-restore --no-build --configuration Release SecretSharingDotNet.slnx

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish package
      run: dotnet nuget push $(find src/bin/Release -type f  -name 'SecretSharingDotNet*.nupkg' -print 2> /dev/null) -k  ${{ steps.login.outputs.NUGET_API_KEY }}  -s https://api.nuget.org/v3/index.json --skip-duplicate
