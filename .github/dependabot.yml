# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    assignees:
      - "shinji-san"
    reviewers:
      - "shinji-san"
    groups:
      # One collective PR per week instead of one per package: a single
      # lock-file regeneration, no two PRs rewriting the same
      # packages.lock.json, and less open-PR time in which a develop merge
      # can trigger a rebase.
      nuget-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      nuget-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    # Dependabot's failing auto-rebases closed its own PRs as "no longer
    # updatable" (#347-#350), silently dropping the bumps. Rebase only on an
    # explicit "@dependabot rebase" comment.
    rebase-strategy: "disabled"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: "develop"
    assignees:
      - "shinji-san"
    reviewers:
      - "shinji-san"
    groups:
      # The init and analyze steps of the CodeQL workflow must run the same
      # action version: init writes a configuration file that analyze reads
      # back, and a version skew aborts the job with a configuration error.
      # Grouping keeps both steps in a single pull request.
      codeql-action:
        patterns:
          - "github/codeql-action*"
